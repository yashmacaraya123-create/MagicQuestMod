name: Build Magical Quest

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip (if needed)
        run: |
          if [ -f build.gradle ]; then
            echo "Project files found at repo root, no unzip needed."
            exit 0
          fi
          zip=$(find . -maxdepth 1 -name '*.zip' | head -1)
          if [ -z "$zip" ]; then
            echo "No build.gradle and no zip file found in the repo root."
            exit 1
          fi
          echo "Unpacking $zip"
          mkdir -p /tmp/proj
          unzip -q -o "$zip" -d /tmp/proj
          gradle_file=$(find /tmp/proj -name build.gradle -not -path '*/__MACOSX/*' | head -1)
          if [ -z "$gradle_file" ]; then
            echo "build.gradle not found inside the zip."
            exit 1
          fi
          root=$(dirname "$gradle_file")
          echo "Project root inside zip: $root"
          cp -a "$root"/. .
          ls -la

      - name: Set up Node (asset generators)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate textures and JSON resources
        run: |
          node tools/generate_assets.cjs
          node tools/generate_json.cjs

      - name: Verify generated assets
        run: |
          count=$(find src/main/resources/assets/magicalquest/textures -name '*.png' | wc -l)
          echo "Generated $count PNG textures"
          if [ "$count" -lt 80 ]; then echo "Too few textures, generator failed"; exit 1; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: magicalquest-jar
          path: build/libs/*.jar
