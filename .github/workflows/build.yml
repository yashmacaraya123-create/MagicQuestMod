name: Build Magical Quest

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (asset generators)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate textures and JSON resources
        run: |
          node tools/generate_assets.cjs
          node tools/generate_json.cjs

      - name: Verify generated assets
        run: |
          count=$(find src/main/resources/assets/magicalquest/textures -name '*.png' | wc -l)
          echo "Generated $count PNG textures"
          if [ "$count" -lt 80 ]; then echo "Too few textures, generator failed"; exit 1; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: magicalquest-jar
          path: build/libs/*.jar
